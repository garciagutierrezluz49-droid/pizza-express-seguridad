server {
    listen 443 ssl;
    server_name api.pizzaexpress.local;
    ssl_certificate /etc/nginx/certs/pizza.crt;
    ssl_certificate_key /etc/nginx/certs/pizza.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location /api/clientes/ { proxy_pass http://ms-clientes:8081/; }
    location /api/productos/ { proxy_pass http://ms-productos:8082/; }
    location /api/pedidos/ { proxy_pass http://ms-pedidos:8083/; }
}
