server {
    listen 443 ssl;
    server_name api.pizzaexpress.local;
    ssl_certificate /etc/nginx/certs/pizza.crt;
    ssl_certificate_key /etc/nginx/certs/pizza.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location /api/clientes/ { return 200 '{"servicio":"ms-clientes","estado":"seguro","tls":"OK","puerto":8081,"restringido":true}'; }
    location /api/productos/ { return 200 '{"servicio":"ms-productos","estado":"seguro","tls":"OK","puerto":8082,"restringido":true}'; }
    location /api/pedidos/ { return 200 '{"servicio":"ms-pedidos","estado":"seguro","tls":"OK","puerto":8083,"restringido":true}'; }
    location / { return 200 'Pizza Express API Gateway Seguro - Puerto 443 OK'; }
}
